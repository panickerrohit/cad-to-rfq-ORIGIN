# Render blueprint for the API (web app goes on Vercel; see DEPLOY.md).
services:
  - type: web
    name: rfq-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
    disk:
      name: jobs
      mountPath: /data
      sizeGB: 1
